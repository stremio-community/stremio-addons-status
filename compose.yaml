services:
  warp:
    image: caomingjun/warp
    restart: no
    environment:
      WARP_SLEEP: "2"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv4.conf.all.src_valid_mark: "1"
    ports:
      # SOCKS5 proxy, bound to host localhost only (not the network) so local dev
      # can route through WARP via socks5://localhost:1080. In compose, services
      # reach it as socks5://warp:1080.
      - "127.0.0.1:1080:1080"
    volumes:
      - warp-data:/var/lib/cloudflare-warp

  postgres:
    image: postgres:16-alpine
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Required by Kener (BullMQ queues + scheduler).
    image: redis:7-alpine
    restart: no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kener:
    # Pinned version (dev and prod): the hub reads Kener's internal dashboard-apis endpoint, so upgrades must be deliberate.
    image: rajnandan1/kener:v4.1.2
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Kener lives in its own database inside the shared Postgres instance; create it once with:
      #   docker compose exec postgres createdb -U ${POSTGRES_USER} ${KENER_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${KENER_DB}
      REDIS_URL: redis://redis:6379
      KENER_SECRET_KEY: ${KENER_SECRET_KEY}
      # Public URL of the status page; required for CSRF protection.
      ORIGIN: ${KENER_PUBLIC_URL}
    ports:
      - "${KENER_PORT}:3000"

  # Legacy status page, kept during the Kener migration's dual-push window; remove after cutover.
  gatus:
    image: ghcr.io/twin/gatus:stable
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GATUS_CONFIG_PATH: /config
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      PUSH_TOKEN: ${PUSH_TOKEN}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL}
    ports:
      - "${GATUS_PORT}:8080"
    volumes:
      # Host-bind the config dir directly (read-only).
      # It holds 00-base.yaml plus the worker-generated 10-endpoints.yaml; Gatus merges every *.yaml here.
      # A host bind (not a named volume) avoids Gatus's baked-in default config.yaml being seeded into the volume.
      - ./gatus/config.d:/config:ro

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: no
    depends_on:
      kener:
        condition: service_started
    environment:
      API_BASE: ${API_BASE}
      KENER_URL: http://kener:3000
      KENER_API_TOKEN: ${KENER_API_TOKEN}
      # Legacy Gatus push (dual-push window); remove after cutover.
      GATUS_URL: http://gatus:8080
      PUSH_TOKEN: ${PUSH_TOKEN}
      PROXY_URL: ${PROXY_URL}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      PROBE_INTERVAL: ${PROBE_INTERVAL}
      LIST_REFRESH: ${LIST_REFRESH}
      CONCURRENCY: ${CONCURRENCY}
      ENDPOINTS_CONFIG_PATH: /config/10-endpoints.yaml
    volumes:
      # Worker writes 10-endpoints.yaml into the same host dir Gatus reads.
      - ./gatus/config.d:/config

  grafana:
    image: grafana/grafana:latest
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KENER_DB: ${KENER_DB}
      # Anonymous read-only viewing; no sign-up, no login form.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  warp-data:
  postgres-data:
  redis-data:
  grafana-data:
