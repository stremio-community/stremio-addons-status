services:
  warp:
    image: caomingjun/warp
    restart: no
    environment:
      WARP_SLEEP: "2"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv4.conf.all.src_valid_mark: "1"
    ports:
      # SOCKS5 proxy, bound to host localhost only (not the network) so local dev
      # can route through WARP via socks5://localhost:1080. In compose, services
      # reach it as socks5://warp:1080.
      - "127.0.0.1:1080:1080"
    volumes:
      - warp-data:/var/lib/cloudflare-warp

  postgres:
    image: postgres:16-alpine
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Required by Kener (BullMQ queues + scheduler).
    image: redis:7-alpine
    restart: no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kener:
    # Pinned version (dev and prod): the hub reads Kener's internal dashboard-apis endpoint, so upgrades must be deliberate.
    image: rajnandan1/kener:v4.1.2
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      KENER_SECRET_KEY: ${KENER_SECRET_KEY}
      # Public URL of the status page; required for CSRF protection.
      ORIGIN: ${KENER_PUBLIC_URL}
    ports:
      - "${KENER_PORT}:3000"

  kener-seed:
    # One-shot first-run setup: creates the Kener admin user and the worker API key, then exits.
    # Idempotent, so it is safe on every `docker compose up`. See scripts/seed-kener.sh.
    image: postgres:16-alpine
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
      kener:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      KENER_PUBLIC_URL: ${KENER_PUBLIC_URL}
      KENER_SECRET_KEY: ${KENER_SECRET_KEY}
      KENER_API_TOKEN: ${KENER_API_TOKEN}
      KENER_ADMIN_EMAIL: ${KENER_ADMIN_EMAIL}
      KENER_ADMIN_PASSWORD: ${KENER_ADMIN_PASSWORD}
    entrypoint: ["sh", "/seed-kener.sh"]
    volumes:
      - ./scripts/seed-kener.sh:/seed-kener.sh:ro
      - ./scripts/seed-kener.sql:/seed-kener.sql:ro

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: no
    depends_on:
      kener-seed:
        condition: service_completed_successfully
    environment:
      API_BASE: ${API_BASE}
      KENER_URL: http://kener:3000
      KENER_API_TOKEN: ${KENER_API_TOKEN}
      PROXY_URL: ${PROXY_URL}
      PROBE_INTERVAL: ${PROBE_INTERVAL}
      LIST_REFRESH: ${LIST_REFRESH}
      CONCURRENCY: ${CONCURRENCY}

  grafana:
    image: grafana/grafana:latest
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Anonymous read-only viewing; no sign-up, no login form.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  warp-data:
  postgres-data:
  redis-data:
  grafana-data:
