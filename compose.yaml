services:
  warp:
    image: caomingjun/warp
    restart: no
    environment:
      WARP_SLEEP: "2"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv4.conf.all.src_valid_mark: "1"
    ports:
      # SOCKS5 proxy, bound to host localhost only (not the network) so local dev
      # can route through WARP via socks5://localhost:1080. In compose, services
      # reach it as socks5://warp:1080.
      - "127.0.0.1:1080:1080"
    volumes:
      - warp-data:/var/lib/cloudflare-warp

  mariadb:
    image: mariadb:11.8
    restart: no
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kuma:
    # Pinned: the worker drives Kuma's internal socket.io API and the hub reads its public
    # status-page API, so upgrades must be tested against both before bumping.
    image: louislam/uptime-kuma:2.4.0
    restart: no
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # Presetting the DB via env skips Kuma's first-run database wizard entirely.
      UPTIME_KUMA_DB_TYPE: mariadb
      UPTIME_KUMA_DB_HOSTNAME: mariadb
      UPTIME_KUMA_DB_PORT: "3306"
      UPTIME_KUMA_DB_NAME: ${MARIADB_DATABASE}
      UPTIME_KUMA_DB_USERNAME: ${MARIADB_USER}
      UPTIME_KUMA_DB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "${KUMA_PORT}:3001"
    volumes:
      # db-config.json plus uploads; the monitoring data itself lives in MariaDB.
      - kuma-data:/app/data

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: no
    depends_on:
      kuma:
        condition: service_healthy
    environment:
      API_BASE: ${API_BASE}
      KUMA_URL: http://kuma:3001
      KUMA_USERNAME: ${KUMA_USERNAME}
      KUMA_PASSWORD: ${KUMA_PASSWORD}
      PROXY_URL: ${PROXY_URL}
      PROBE_INTERVAL: ${PROBE_INTERVAL}
      LIST_REFRESH: ${LIST_REFRESH}
      CONCURRENCY: ${CONCURRENCY}

volumes:
  warp-data:
  mariadb-data:
  kuma-data:
