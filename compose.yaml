services:
  warp:
    image: caomingjun/warp
    restart: no
    environment:
      WARP_SLEEP: "2"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv4.conf.all.src_valid_mark: "1"
    ports:
      # SOCKS5 proxy, bound to host localhost only (not the network) so local dev
      # can route through WARP via socks5://localhost:1080. In compose, services
      # reach it as socks5://warp:1080.
      - "127.0.0.1:1080:1080"
    volumes:
      - warp-data:/var/lib/cloudflare-warp

  postgres:
    image: postgres:16-alpine
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kuvasz:
    # Pinned deliberately: the worker drives Kuvasz's v2 REST API and the hub reads it, so upgrades must be tested.
    image: kuvaszmonitoring/kuvasz:4.0.1
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: "UTC"
      DATABASE_HOST: postgres
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      ENABLE_AUTH: "true"
      ADMIN_USER: ${KUVASZ_ADMIN_USER}
      ADMIN_PASSWORD: ${KUVASZ_ADMIN_PASSWORD}
      ADMIN_API_KEY: ${KUVASZ_API_KEY}
      # The public status page lives at /status; the admin UI and API stay behind auth.
      PUBLISH_DEFAULT_STATUS_PAGE: "true"
      DEFAULT_STATUS_PAGE_TITLE: "Stremio Addons Status"
      DEFAULT_STATUS_PAGE_LOGO_URL: "https://stremio-addons.net/favicon.ico"
      # Substituted into kuvasz.yml's Discord integration definition.
      # An unset/empty webhook falls back to a placeholder so the integration definition stays valid; the worker only assigns it to monitors when the real webhook is set.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/0/unconfigured}
    ports:
      - "${KUVASZ_PORT}:8080"
    volumes:
      - ./kuvasz/kuvasz.yml:/config/kuvasz.yml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:8080/api/v2/health || exit 1",
        ]
      interval: 30s
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: no
    depends_on:
      kuvasz:
        condition: service_healthy
    environment:
      API_BASE: ${API_BASE}
      KUVASZ_URL: http://kuvasz:8080
      KUVASZ_API_KEY: ${KUVASZ_API_KEY}
      PUSH_SECRET_SEED: ${PUSH_SECRET_SEED}
      PROXY_URL: ${PROXY_URL}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      PROBE_INTERVAL: ${PROBE_INTERVAL}
      LIST_REFRESH: ${LIST_REFRESH}
      CONCURRENCY: ${CONCURRENCY}

  grafana:
    image: grafana/grafana:latest
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Anonymous read-only viewing; no sign-up, no login form.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  warp-data:
  postgres-data:
  grafana-data:
