storage:
  type: postgres
  path: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE}"
  caching: true
  # ~24h of results at the worker's 5m PROBE_INTERVAL.
  maximum-number-of-results: 300

ui:
  title: "Stremio Addons Status"
  header: "Stremio Addons Status"
  # Empty hides the subtitle; omitting the key falls back to the Gatus default.
  header-subtitle: ""
  dashboard-heading: "Uptime"
  dashboard-subheading: "Real status checks for Stremio addons and services."
  description: "Monitors the health of Stremio addons."
  default-sort-by: group
  logo: "https://stremio-addons.net/favicon.ico"
  link: "/"
  # Hide the Gatus footer social links.
  custom-css: |
    #social { display: none !important; }
  buttons:
    - name: "stremio-addons.net"
      link: "https://stremio-addons.net"
    - name: "GitHub"
      link: "https://github.com/Stremio-Community/stremio-addons-status"

alerting:
  discord:
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    title: ":satellite: Stremio Addons Status"

endpoints:
  - name: stremio-addons.net
    group: Infrastructure
    url: "https://stremio-addons.net/health"
    interval: 5m
    align-to-interval: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == OK"
    alerts:
      - type: discord
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Stremio API
    group: "   Stremio Platform"
    url: "https://api.strem.io/api/v1"
    method: POST
    interval: 5m
    align-to-interval: true
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == any(200, 400, 405)"
    alerts:
      - type: discord
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Cinemeta
    group: "   Stremio Platform"
    url: "https://v3-cinemeta.strem.io/manifest.json"
    interval: 5m
    align-to-interval: true
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
      - "has([BODY].id) == true"
    alerts:
      - type: discord
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Stremio Web Player
    group: "   Stremio Platform"
    url: "https://web.stremio.com/"
    interval: 5m
    align-to-interval: true
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Stremio Website
    group: "   Stremio Platform"
    url: "https://www.stremio.com/"
    interval: 5m
    align-to-interval: true
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Real-Debrid API
    group: "  Debrid Services"
    url: "https://api.real-debrid.com/rest/1.0/time"
    interval: 5m
    align-to-interval: true
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: AllDebrid API
    group: "  Debrid Services"
    url: "https://api.alldebrid.com/v4/ping"
    interval: 5m
    align-to-interval: true
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Premiumize API
    group: "  Debrid Services"
    url: "https://www.premiumize.me/api/account/info"
    interval: 5m
    align-to-interval: true
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == any(200, 401)"
    alerts:
      - type: discord
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: TorBox API
    group: "  Debrid Services"
    url: "https://api.torbox.app/v1/api/stats"
    interval: 5m
    align-to-interval: true
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == any(200, 401)"
    alerts:
      - type: discord
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: DebridIO
    group: " Services"
    url: "https://addon.debridio.com/healthz"
    interval: 5m
    align-to-interval: true
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: discord
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: MDBList API
    group: " Services"
    url: "https://api.mdblist.com"
    interval: 5m
    align-to-interval: true
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

# Per-addon verdicts are pushed by the worker as external-endpoints (10-endpoints.yaml).
