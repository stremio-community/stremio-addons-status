storage:
  type: postgres
  path: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
  caching: true

ui:
  title: "Stremio Addons Status"
  header: "Stremio Addons Status"
  dashboard-heading: "Uptime"
  dashboard-subheading: "Real-time uptime of Stremio addons & services. Powered by Gatus and stremio-addons.net."
  description: "Monitors the health of Stremio addons. Powered by Gatus and stremio-addons.net."
  default-sort-by: group
  logo: "https://stremio-addons.net/favicon.ico"
  link: "https://stremio-addons.net"
  # Hide the Gatus footer social links.
  custom-css: |
    #social { display: none !important; }
  buttons:
    - name: "stremio-addons.net"
      link: "https://stremio-addons.net"
    - name: "GitHub"
      link: "https://github.com/Stremio-Community/stremio-addons-status"
    - name: "Grafana"
      link: "${GRAFANA_PUBLIC_URL}/d/stremio-addons-home?kiosk"

alerting:
  discord:
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    title: ":satellite: Stremio Addons Status"

endpoints:
  - name: stremio-addons.net
    group: Infrastructure
    url: "https://stremio-addons.net/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == OK"
    alerts:
      - type: discord
        description: "stremio-addons.net unreachable"
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Stremio API
    group: Stremio Platform
    url: "https://api.strem.io/api/v1"
    method: POST
    interval: 5m
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == any(200, 400, 405)"
    alerts:
      - type: discord
        description: "Stremio API unreachable"
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Cinemeta
    group: Stremio Platform
    url: "https://v3-cinemeta.strem.io/manifest.json"
    interval: 5m
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
      - "has([BODY].id) == true"
    alerts:
      - type: discord
        description: "Cinemeta unreachable"
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Stremio Web Player
    group: Stremio Platform
    url: "https://web.stremio.com/"
    interval: 5m
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord
        description: "Stremio Web Player unreachable"
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Stremio Website
    group: Stremio Platform
    url: "https://www.stremio.com/"
    interval: 5m
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord
        description: "Stremio Website unreachable"
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Real-Debrid API
    group: Debrid Services
    url: "https://api.real-debrid.com/rest/1.0/time"
    interval: 5m
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord
        description: "Real-Debrid API unreachable"
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: AllDebrid API
    group: Debrid Services
    url: "https://api.alldebrid.com/v4/ping"
    interval: 5m
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord
        description: "AllDebrid API unreachable"
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: Premiumize API
    group: Debrid Services
    url: "https://www.premiumize.me/api/account/info"
    interval: 5m
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == any(200, 401)"
    alerts:
      - type: discord
        description: "Premiumize API unreachable"
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

  - name: TorBox API
    group: Debrid Services
    url: "https://api.torbox.app/v1/api/stats"
    interval: 5m
    client:
      proxy-url: "${PROXY_URL}"
    conditions:
      - "[STATUS] == any(200, 401)"
    alerts:
      - type: discord
        description: "TorBox API unreachable"
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 1

# Per-addon verdicts are pushed by the worker as external-endpoints (10-endpoints.yaml).
