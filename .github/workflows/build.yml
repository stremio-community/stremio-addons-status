---
# Builds the worker's image on every push to main and pushes it to GHCR, where Flux picks it up; see apps/stremio-addons-status.yaml in sleeyax/k8s-self-managed.
name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # main-<commit time>-<short SHA>: Flux deploys the tag with the highest commit time, so re-running an old build never rolls back.
      - name: Name the image
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:main-$(git log -1 --format=%ct)-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
